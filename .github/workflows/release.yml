# Build the redistributable for Windows and Linux.
#
# The whole reason this can exist is that Verdite3.Launcher builds WITHOUT the
# disc: it ships the inputs to a build (config/, and the port's own C#) and makes
# the game on the player's machine from the image they own. So CI never needs,
# never has and never handles game data.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rc:
        description: 'Publish the build as the rolling "rc" prerelease (scripts/prerelease.sh)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}

    steps:
      # Every tag, so a run started by hand is numbered by the newest one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # RecompOne is a git subtree of the fork -- its sources are tracked in this
      # repository, so nothing is cloned or patched here and there is no network
      # dependency on upstream. This only builds the recompiler.
      - name: Build the RecompOne subtree
        shell: bash
        run: bash scripts/setup_tools.sh

      # The property the release depends on, asserted rather than assumed: if the
      # launcher ever gains a dependency on generated/, this is where it is caught,
      # and not after somebody has downloaded it.
      - name: Assert the launcher needs no disc
        shell: bash
        run: |
          test ! -e generated || { echo "generated/ exists in CI; it must not"; exit 1; }
          test -z "$(ls -A disc 2>/dev/null | grep -v README.md || true)" || { echo "disc data in CI"; exit 1; }

      # The tag is the version. Handed to every build as VERDITE_VERSION, so the
      # artifacts are named by the tag this run was pushed for even where an
      # older checkout has a higher tag beside it; a tag that is not
      # MAJOR.MINOR.PATCH could never be announced, so it is refused here.
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1; }
          echo "VERDITE_VERSION=$version" >> "$GITHUB_ENV"

      # The commit stamped into the assembly, so a downloaded build can say which
      # one it is. The checkout is a detached HEAD at the tag, so the sha the
      # csproj's own `git rev-parse` would find is the right one anyway; this is
      # here so the value is identical on both legs and does not depend on git
      # being reachable from inside MSBuild on a Windows runner.
      - name: Stamp the build
        shell: bash
        run: echo "VERDITE3_BUILD=$(git rev-parse --short=9 HEAD)" >> "$GITHUB_ENV"

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
          bash packaging/linux/build-appimage.sh

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          # Inno Setup is preinstalled on windows-latest; add it to PATH so the
          # script builds the installer rather than only the zip.
          $iscc = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $iscc) { echo $iscc >> $env:GITHUB_PATH }
          ./packaging/windows/build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: verdite3-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.zip
            dist/*setup.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          name: Verdite3 ${{ github.ref_name }}
          # Appended under the text below: the commits since the previous tag,
          # which is what makes a tag worth cutting rather than a number worth
          # remembering.
          generate_release_notes: true
          body: |
            **Verdite3 ships no game data.** You need your own dump of King's
            Field II (NTSC-U, `SLUS-00255`) as a `.chd`, or as a `.cue` / `.bin`
            pair.

            On first launch Verdite3 asks for that image and builds the game from
            it, which takes about fifteen seconds and happens once. Later launches
            start straight away.

            Note that the US *King's Field* (`SLUS-00158`) is a different game,
            Verdite2's, and will be refused.

  # The release candidate: one prerelease under the tag `rc`, replaced whole on
  # every run, so there is never more than one and its download links never
  # change. Each package is zipped with the RC_PASSWORD secret (AES-256), under a
  # name without the commit; the files inside carry it, and so does the title. A
  # prerelease is never GitHub's "latest", so the launcher's update check, which
  # reads only that, never announces it; the tag is no version (scripts/version.sh
  # reads vMAJOR.MINOR.PATCH alone) and starts no workflow. rc-cleanup.yml
  # deletes it when a release is published.
  rc:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.rc
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RC_PASSWORD: ${{ secrets.RC_PASSWORD }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Zip each package with the password
        run: |
          test -n "$RC_PASSWORD" || { echo "the RC_PASSWORD secret is not set"; exit 1; }
          command -v 7z >/dev/null || { sudo apt-get update && sudo apt-get install -y p7zip-full; }
          sha="${GITHUB_SHA::9}"
          mkdir -p out stage/linux stage/setup stage/win
          cp dist/*.AppImage "stage/linux/Verdite3-rc-$sha-x86_64.AppImage"
          chmod +x stage/linux/*.AppImage
          cp dist/*setup.exe "stage/setup/Verdite3-rc-$sha-win-x64-setup.exe"
          unzip -q dist/*-win-x64.zip -d stage/win
          (cd stage/linux && 7z a -tzip -mem=AES256 "-p$RC_PASSWORD" ../../out/Verdite3-rc-linux-x86_64.zip . >/dev/null)
          (cd stage/setup && 7z a -tzip -mem=AES256 "-p$RC_PASSWORD" ../../out/Verdite3-rc-win-x64-setup.zip . >/dev/null)
          (cd stage/win && 7z a -tzip -mem=AES256 "-p$RC_PASSWORD" ../../out/Verdite3-rc-win-x64.zip . >/dev/null)
          for f in out/*.zip; do 7z t "-p$RC_PASSWORD" "$f" >/dev/null; done
          ls -la out

      - name: Replace the rc prerelease
        run: |
          gh release delete rc --cleanup-tag --yes 2>/dev/null || true
          gh release create rc out/*.zip --target "$GITHUB_SHA" --prerelease \
            --title "Verdite3 rc (${GITHUB_SHA::9})" --notes ""
